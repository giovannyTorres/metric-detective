name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: detective
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: detective_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detective -d detective_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MD_TEST_DATABASE_URL: postgresql://detective:ci-disposable@localhost:5432/detective_test
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=metric_detective --cov-report=term-missing --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests
          path: test-results.xml
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: python scripts/compose_smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
