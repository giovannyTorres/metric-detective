[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "metric-detective"
version = "0.1.0"
description = "Evidence-first revenue investigations with DuckDB and a bounded LangGraph investigator"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "duckdb==2.0.0",
  "pydantic==2.14.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "streamlit==1.66.1",
  "plotly==7.1.0",
  "langgraph==1.2.19",
  "langchain-ollama==1.1.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "tzdata==2026.2",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.0.0", "ruff==0.17.3", "Pillow==12.3.0"]

[project.scripts]
metric-detective = "metric_detective.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metric_detective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires MD_TEST_DATABASE_URL and a real PostgreSQL server", "live_llm: calls a real locally configured Ollama model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["metric_detective"]
omit = ["*/ui.py"]
